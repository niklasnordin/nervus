site_name: Nervus
site_description: Open-source block-diagram modeling and simulation in Python
site_url: https://ikjbi.github.io/nervus/
repo_url: https://github.com/ikjbi/nervus
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
markdown_extensions:
  - admonition
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - toc: { permalink: true }
extra:
  version:
    provider: mike  # the version selector: one site per release (see .github/workflows/docs.yml)
    default: latest
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
