# Publish a release to PyPI: push a tag like v0.1.0 (it must match __version__ in src/nervus/__init__.py).
# Uses PyPI trusted publishing: no password or token is stored here. One-time setup on pypi.org: add a
# "pending publisher" for the project nervus with owner ikjbi, repository nervus, workflow release.yml and
# environment pypi (see CONTRIBUTING.md, "Releasing").
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Tag and version agree
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/nervus/__init__.py)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but __version__ $version"; exit 1; }
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 cppcheck
          uv sync --extra gui --extra can --extra mdf --extra fmi
          QT_QPA_PLATFORM=offscreen uv run pytest -q
      - name: Build
        run: uv build
      - name: Check the packages
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-notes:  # a GitHub Release with this version's section of CHANGELOG.md and the packages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Nervus $version" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
