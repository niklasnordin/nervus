[project]
name = "nervus"
dynamic = ["version", "readme"]  # the version from src/nervus/__init__.py, the readme below
description = "Open-source block-diagram modeling and simulation in Python — a Simulink alternative aimed at ECU control software."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan Bjoerk", email = "johan.bjoerk1@gmail.com" }]
requires-python = ">=3.11"
keywords = ["simulation", "block diagram", "control systems", "simulink", "ecu", "model-based design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13", "matplotlib>=3.8"]
plot = ["matplotlib>=3.8"]
can = ["cantools>=39", "msgpack>=1.0"]
obd = ["pyserial>=3.5"]
mdf = ["asammdf>=8"]
fmi = ["fmpy>=0.3"]

[project.scripts]
nervus = "nervus.cli:main"

[project.urls]
Homepage = "https://github.com/ikjbi/nervus"
Issues = "https://github.com/ikjbi/nervus/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest-qt>=4.4",
    "cantools>=39",
    "pytest-timeout>=2.4.0",
    "asammdf>=8",
    "fmpy>=0.3",
]
docs = [
    "mkdocs-material>=9.5",
    "mike>=2.1",
]

[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

# The README on PyPI: relative links and images point to GitHub (pypi.org cannot follow them).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?:)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/ikjbi/nervus/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?:|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/ikjbi/nervus/blob/main/\1)'

[tool.hatch.version]
path = "src/nervus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nervus"]
artifacts = ["src/nervus/gui/resources/help/*.md", "src/nervus/gui/resources/figures/*.png"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "nervus/examples"  # the example models and scripts, for nervus --copy-examples and File > Open Example
"CONTRIBUTORS.md" = "nervus/CONTRIBUTORS.md"  # shown in Help > About Nervus
"LICENSE" = "nervus/LICENSE"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md",
           "CONTRIBUTORS.md",
           "pyproject.toml", "mkdocs.yml"]
exclude = ["__pycache__", "*.pyc", "*.fmu"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
# Math symbols (×, τ, ·) in docstrings are intentional.
ignore = ["RUF001", "RUF002", "E501"]  # line length is enforced by the formatter; long LaTeX in docstrings is fine

[tool.ruff.lint.per-file-ignores]
# Matrix names A, B, C, D follow control-theory convention.
"src/nervus/blocks/continuous.py" = ["N806"]
# Qt naming conventions: overridden event handlers and camelCase signals.
"src/nervus/gui/**" = ["N802", "N806", "N815"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
files = ["src/nervus"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*", "pyqtgraph.*", "cantools.*", "serial.*", "asammdf.*", "fmpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --timeout=60"
timeout_method = "thread"  # also interrupts a test blocked inside Qt, with a stack dump
qt_api = "pyside6"
